name: Release

# Pushing a tag v<version> builds the Windows installer, signs it for the
# updater and publishes the release Aven updates itself from. The version in
# desktop/Cargo.toml must be the tag's.
#
# Needs two repository secrets: TAURI_SIGNING_PRIVATE_KEY, the updater's
# private key whose public half is in desktop/tauri.conf.json, and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD, its password (empty when it has none).
#
# With SignPath set up (see .signpath/README.md), the browser and then its
# installer also get a Windows code signature, each after an approver accepts
# the request on SignPath. Without it, the installer is published unsigned,
# as before.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  # SignPath reads the run and downloads its artifacts with this token.
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
  SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
  SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}

jobs:
  windows:
    name: Windows installer
    runs-on: windows-2025
    # Each signature waits for an approver, up to an hour each.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: The tag is the version being built
        id: version
        shell: bash
        run: |
          version=$(grep -m1 '^version' desktop/Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in desktop/Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Whether this release is code signed
        id: signing
        shell: bash
        run: |
          if [ -n "$SIGNPATH_ORGANIZATION_ID" ] && [ -n "$SIGNPATH_PROJECT_SLUG" ] && [ -n "$SIGNPATH_SIGNING_POLICY_SLUG" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::SignPath is not set up: this installer carries no Windows code signature"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - run: pnpm install --frozen-lockfile
      # Builds the interface first (beforeBuildCommand), then the release app
      # and its per-user installer. Making the installer also writes into the
      # app which kind of install it is (Tauri's bundle-type mark), so the app
      # is only signed after this, or the mark would break its signature.
      - run: pnpm --dir desktop exec tauri build --bundles nsis

      - name: Upload the browser for signing
        if: steps.signing.outputs.enabled == 'true'
        id: unsigned-app
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-app
          path: target/release/aven-desktop.exe
          if-no-files-found: error
      - name: Sign the browser
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-app
          parameters: |
            version: ${{ toJSON(steps.version.outputs.version) }}
      - name: Make the installer again around the signed browser
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          cp signed-app/aven-desktop.exe target/release/aven-desktop.exe
          powershell -NoProfile -File scripts/release/check_signature.ps1 -Path target/release/aven-desktop.exe -When "as SignPath returned it"
          # The mark is already there, so making the installer leaves the
          # signed browser byte for byte as it is; checked, not assumed.
          rm target/release/bundle/nsis/*-setup.exe
          pnpm --dir desktop exec tauri bundle --bundles nsis
          powershell -NoProfile -File scripts/release/check_signature.ps1 -Path target/release/aven-desktop.exe -When "once the installer was made around it"
      - name: Gather the installer
        shell: bash
        run: |
          mkdir release
          cp target/release/bundle/nsis/*-setup.exe release/Aven-Windows-x64-setup.exe

      - name: Upload the installer for signing
        if: steps.signing.outputs.enabled == 'true'
        id: unsigned-installer
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: release/Aven-Windows-x64-setup.exe
          if-no-files-found: error
      - name: Sign the installer
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-installer
          parameters: |
            version: ${{ toJSON(steps.version.outputs.version) }}
      - name: Take the signed installer
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          cp signed-installer/Aven-Windows-x64-setup.exe release/Aven-Windows-x64-setup.exe
          powershell -NoProfile -File scripts/release/check_signature.ps1 -Path release/Aven-Windows-x64-setup.exe -When "as SignPath returned it"

      # The updater's signature covers the installer as published, so it is
      # made last, after the Windows code signature changed the file.
      - name: Sign the installer for the updater and write the update manifest
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::the TAURI_SIGNING_PRIVATE_KEY secret is not set: a release nobody can update from is not published"
            exit 1
          fi
          pnpm --dir desktop exec tauri signer sign "$(cygpath -w "$PWD/release/Aven-Windows-x64-setup.exe")"
          node scripts/release/latest_json.mjs "${GITHUB_REF_NAME#v}" "$GITHUB_REPOSITORY" release/Aven-Windows-x64-setup.exe.sig > release/latest.json
          (cd release && sha256sum Aven-Windows-x64-setup.exe > SHA256SUMS)
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Aven ${GITHUB_REF_NAME#v}" \
            --notes "[Code signing policy](https://github.com/$GITHUB_REPOSITORY/blob/main/docs/code-signing.md) · [Privacy](https://github.com/$GITHUB_REPOSITORY/blob/main/PRIVACY.md)" \
            --generate-notes
